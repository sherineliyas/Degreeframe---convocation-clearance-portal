<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal - Convocation Clearance | HITS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      min-height: 100vh;
      padding-top: 2rem;
      padding-bottom: 3rem;
    }
    .app-card {
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .letter-spacing-2 {
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="app-card p-3 p-md-4">
    <!-- BRANDING HEADER -->
    <div class="d-flex align-items-center justify-content-between bg-light p-3 rounded-4 mb-4 border">
      <div>
        <h5 class="fw-bold text-dark mb-0">Faculty Approval Portal</h5>
        <small class="text-muted">Hindustan Institute of Technology & Science — Faculty Portal</small>
      </div>
      <a href="../" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="bi bi-house me-1"></i> Home</a>
    </div>

    <!-- EMAIL + OTP FACULTY AUTHENTICATION SECTION -->
    <div id="facultyAuthSection" class="card border-0 bg-light p-4 mb-4 rounded-4 shadow-sm text-center">
      <h5 class="fw-bold text-primary mb-2"><i class="bi bi-shield-lock me-2"></i>Faculty Authentication</h5>
      <p class="text-muted small mb-3">Please sign in with your official university email (@hindustanuniv.ac.in).</p>
      
      <!-- EMAIL STEP -->
      <div class="row justify-content-center g-2" id="facultyEmailInputStep">
        <div class="col-md-7">
          <input type="email" id="facultyAuthEmail" class="form-control form-control-lg" placeholder="faculty@hindustanuniv.ac.in" required>
        </div>
        <div class="col-md-3">
          <button type="button" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" id="btnFacultySendOtp" onclick="requestFacultyOtp()">
            Send OTP
          </button>
        </div>
      </div>

      <!-- OTP STEP -->
      <div class="row justify-content-center g-2 mt-3" id="facultyOtpInputStep" style="display: none;">
        <div class="col-md-5">
          <input type="text" id="facultyAuthOtp" class="form-control form-control-lg text-center fw-bold letter-spacing-2" placeholder="ENTER 6-DIGIT OTP" maxlength="6">
        </div>
        <div class="col-md-3">
          <button type="button" class="btn btn-success btn-lg w-100 fw-bold shadow-sm" id="btnFacultyVerifyOtp" onclick="verifyFacultyOtp()">
            Verify & Login
          </button>
        </div>
        <div class="col-12 mt-2">
          <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="resetFacultyAuthStep()">← Change Email</button>
        </div>
      </div>

      <div id="facultyAuthAlert" class="mt-3"></div>
    </div>

    <!-- AUTHENTICATED FACULTY DASHBOARD -->
    <div id="facultyPortalWrapper" style="display: none;">
      
      <!-- FACULTY USER INFO CARD -->
      <div class="card bg-primary text-white p-3 rounded-4 mb-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="fw-bold mb-1" id="facName">--</h6>
            <div class="small opacity-75">
              <span id="facRoleBadge" class="badge bg-light text-primary me-2"></span>
              Dept: <strong id="facDept">--</strong> | Spec: <strong id="facSpec">--</strong> | Batch: <strong id="facBatch">--</strong> | Sec: <strong id="facSec">--</strong>
            </div>
          </div>
          <div class="d-flex gap-2">
            <!-- HOD DIRECTORY MANAGEMENT BUTTON -->
            <button id="btnHodAddTeacher" class="btn btn-sm btn-warning fw-bold text-dark" style="display:none;" data-bs-toggle="modal" data-bs-target="#addTeacherModal">
              <i class="bi bi-person-plus-fill me-1"></i> Add Class Teacher
            </button>
            <button class="btn btn-sm btn-outline-light" onclick="logoutFaculty()"><i class="bi bi-box-arrow-right"></i> Sign Out</button>
          </div>
        </div>
      </div>

      <!-- INLINE FACULTY ACTION ALERT FEEDBACK -->
      <div id="facultyActionAlert" class="mb-3"></div>

      <!-- PENDING APPROVALS LIST -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-dark mb-0"><i class="bi bi-card-checklist me-2"></i>Pending Applications</h5>
        <button class="btn btn-outline-primary btn-sm fw-bold" onclick="loadPendingApplications()">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh List
        </button>
      </div>

      <div id="applicationsContainer">
        <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span> Loading requests...</div>
      </div>

    </div>
  </div>
</div>

<!-- HOD MODAL: ADD CLASS TEACHER -->
<div class="modal fade" id="addTeacherModal" tabindex="-1" aria-labelledby="addTeacherModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header bg-warning text-dark rounded-top-4">
        <h6 class="modal-title fw-bold" id="addTeacherModalLabel"><i class="bi bi-person-gear me-2"></i>Assign Class Teacher</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="addTeacherForm" onsubmit="return submitAddTeacher(event);">
        <div class="modal-body p-4">
          <div id="addTeacherAlert"></div>
          <div class="mb-3">
            <label class="form-label fw-bold small">Teacher Official Email <span class="text-danger">*</span></label>
            <input type="email" id="newTeacherEmail" class="form-control" placeholder="teacher@hindustanuniv.ac.in" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold small">Teacher Full Name <span class="text-danger">*</span></label>
            <input type="text" id="newTeacherName" class="form-control" placeholder="Dr. Jane Doe" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold small">Department</label>
              <input type="text" id="newTeacherDept" class="form-control bg-light" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Specialization</label>
              <input type="text" id="newTeacherSpec" class="form-control" placeholder="e.g. ALL or MCA">
            </div>
          </div>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label fw-bold small">Shift / Batch <span class="text-danger">*</span></label>
              <select id="newTeacherBatch" class="form-select" required>
                <option value="Batch A">Batch A</option>
                <option value="Batch B">Batch B</option>
                <option value="ALL">ALL</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Section(s) <span class="text-danger">*</span></label>
              <input type="text" id="newTeacherSection" class="form-control" placeholder="e.g. A, B or ALL" required>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light rounded-bottom-4">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" id="btnSaveTeacher" class="btn btn-warning btn-sm fw-bold px-4">Save Teacher</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- FACULTY PORTAL SCRIPT -->
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySUmRQwaIqp3sx1_rUa7x3qWffv_iRFkAClyUkeqcJ4srOc7T0kKm5-bM8Lb9iU4SY/exec";
  let currentFaculty = null;

  window.requestFacultyOtp = async function() {
    const emailInput = document.getElementById('facultyAuthEmail').value.trim().toLowerCase();
    const alertBox = document.getElementById('facultyAuthAlert');
    const btnSend = document.getElementById('btnFacultySendOtp');

    if (alertBox) alertBox.innerHTML = '';

    if (!emailInput || !emailInput.endsWith('@hindustanuniv.ac.in')) {
      if (alertBox) alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-shield-x me-2"></i>Access Denied: Faculty login requires an official @hindustanuniv.ac.in email address.</div>`;
      return;
    }

    btnSend.disabled = true;
    btnSend.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Sending...`;

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendOtp", email: emailInput })
      });
      const res = await response.json();

      if (res.success) {
        document.getElementById('facultyEmailInputStep').style.display = 'none';
        document.getElementById('facultyOtpInputStep').style.display = 'flex';
        if (alertBox) alertBox.innerHTML = `<div class="alert alert-success py-2"><i class="bi bi-check-circle-fill me-2"></i>OTP code sent to <strong>${emailInput}</strong>. Please check your inbox.</div>`;
      } else {
        if (alertBox) alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-x-circle-fill me-2"></i>${res.message || 'Failed to send OTP.'}</div>`;
      }
    } catch (err) {
      if (alertBox) alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-exclamation-octagon-fill me-2"></i>Error connecting to server: ${err.message}</div>`;
    } finally {
      btnSend.disabled = false;
      btnSend.innerHTML = `Send OTP`;
    }
  };

  window.verifyFacultyOtp = async function() {
    const emailInput = document.getElementById('facultyAuthEmail').value.trim().toLowerCase();
    const otpEntered = document.getElementById('facultyAuthOtp').value.trim();
    const alertBox = document.getElementById('facultyAuthAlert');
    const btnVerify = document.getElementById('btnFacultyVerifyOtp');

    if (!otpEntered || otpEntered.length !== 6) {
      if (alertBox) alertBox.innerHTML = `<div class="alert alert-warning py-2"><i class="bi bi-exclamation-triangle-fill me-2"></i>Please enter a valid 6-digit OTP code.</div>`;
      return;
    }

    btnVerify.disabled = true;
    btnVerify.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Verifying...`;

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ 
          action: "verifyOtp", 
          email: emailInput, 
          otp: otpEntered,
          portalType: "faculty"
        })
      });

      const data = await response.json();

      if (data.success && data.faculty) {
        currentFaculty = data.faculty;
        
        document.getElementById('facName').innerText = currentFaculty.name;
        document.getElementById('facRoleBadge').innerText = currentFaculty.role;
        document.getElementById('facDept').innerText = currentFaculty.department;
        document.getElementById('facSpec').innerText = currentFaculty.specialization || 'General';
        document.getElementById('facBatch').innerText = currentFaculty.batch || 'ALL';
        document.getElementById('facSec').innerText = currentFaculty.section || 'ALL';

        if (currentFaculty.role === "HOD") {
          document.getElementById('btnHodAddTeacher').style.display = 'inline-block';
          document.getElementById('newTeacherDept').value = currentFaculty.department;
        }

        document.getElementById('facultyAuthSection').style.display = 'none';
        document.getElementById('facultyPortalWrapper').style.display = 'block';

        loadPendingApplications();
      } else {
        if (alertBox) alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-x-circle-fill me-2"></i>${data.message || 'Authentication failed.'}</div>`;
      }
    } catch (err) {
      if (alertBox) alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-exclamation-octagon-fill me-2"></i>Authentication Error: ${err.message}</div>`;
    } finally {
      btnVerify.disabled = false;
      btnVerify.innerHTML = `Verify & Login`;
    }
  };

  window.resetFacultyAuthStep = function() {
    document.getElementById('facultyEmailInputStep').style.display = 'flex';
    document.getElementById('facultyOtpInputStep').style.display = 'none';
    document.getElementById('facultyAuthOtp').value = '';
    const alertBox = document.getElementById('facultyAuthAlert');
    if (alertBox) alertBox.innerHTML = '';
  };

  window.logoutFaculty = function() {
    currentFaculty = null;
    document.getElementById('facultyPortalWrapper').style.display = 'none';
    document.getElementById('facultyAuthSection').style.display = 'block';
    document.getElementById('facultyAuthEmail').value = '';
    document.getElementById('btnHodAddTeacher').style.display = 'none';
    resetFacultyAuthStep();
  };

  window.renderStudentCard = function(student) {
    if (!student) return '';

    let photoSrc = 'https://via.placeholder.com/100x120?text=No+Photo';
    const rawPhoto = student.base64Photo || student.photoUrl || student.photoData;

    if (rawPhoto) {
      if (rawPhoto.startsWith('data:image') || rawPhoto.startsWith('http')) {
        photoSrc = rawPhoto;
      } else {
        photoSrc = `data:image/jpeg;base64,${rawPhoto}`;
      }
    }

    const rowId = student.rowIndex || student.rowId;
    const status = student.appStatus || student.status || 'PENDING';
    const spec = student.spec || student.specialization || 'N/A';
    const dept = student.dept || student.department || 'N/A';
    const sec = student.sec || student.section || 'N/A';
    const batch = student.batch || 'Batch A';

    return `
      <div class="card border-0 shadow-sm p-3 mb-3 rounded-4 bg-light">
        <div class="row g-3 align-items-center">
          <div class="col-md-2 text-center">
            <img src="${photoSrc}" 
                 alt="Student Photo" 
                 class="img-thumbnail rounded-3" 
                 style="width: 100px; height: 120px; object-fit: cover;"
                 onerror="this.src='https://via.placeholder.com/100x120?text=Error';" />
          </div>

          <div class="col-md-6">
            <h6 class="fw-bold mb-1">${student.name || student.studentName} (${student.regNo || student.registerNumber})</h6>
            <p class="small text-muted mb-1">
              <strong>Dept:</strong> ${dept} | <strong>Spec:</strong> ${spec} | <strong>Sec:</strong> ${sec} | <strong>Batch:</strong> ${batch}
              <span class="badge bg-warning text-dark ms-2">${status}</span>
            </p>
            <div class="d-flex gap-2 mt-2">
              ${student.proof10thUrl ? `<a href="${student.proof10thUrl}" target="_blank" class="btn btn-sm btn-outline-info py-0"><i class="bi bi-file-earmark-pdf"></i> 10th Proof</a>` : ''}
              ${student.proofTcUrl ? `<a href="${student.proofTcUrl}" target="_blank" class="btn btn-sm btn-outline-info py-0"><i class="bi bi-file-earmark-pdf"></i> TC Proof</a>` : ''}
            </div>
          </div>

          <div class="col-md-4">
            <input type="text" id="remark_${rowId}" class="form-control form-control-sm mb-2" placeholder="Enter remarks/reason...">
            <div class="d-flex gap-2">
              <button class="btn btn-success btn-sm w-50 fw-bold" onclick="submitDecision('${rowId}', 'APPROVE')">
                <i class="bi bi-check-circle"></i> Approve
              </button>
              <button class="btn btn-danger btn-sm w-50 fw-bold" onclick="submitDecision('${rowId}', 'REJECT')">
                <i class="bi bi-x-circle"></i> Reject
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  };

  window.loadPendingApplications = async function() {
    const container = document.getElementById('applicationsContainer');
    if (!container) return;
    container.innerHTML = `<div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span> Loading applications...</div>`;

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getPendingApplications", email: currentFaculty.email })
      });

      const rawText = await res.text();
      let data;
      try {
        data = JSON.parse(rawText);
      } catch (e) {
        throw new Error("Invalid JSON response received from server.");
      }

      if (data.success && data.data && data.data.length > 0) {
        let html = '';
        data.data.forEach(item => {
          html += window.renderStudentCard(item);
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<div class="alert alert-info text-center rounded-3 py-3">No pending applications found for your assigned scope.</div>`;
      }
    } catch (err) {
      container.innerHTML = `<div class="alert alert-danger text-center rounded-3 py-2">Error loading applications: ${err.message}</div>`;
    }
  };

  window.submitDecision = async function(rowIndex, decision) {
    const remarksInput = document.getElementById(`remark_${rowIndex}`);
    const remarks = remarksInput ? remarksInput.value.trim() : '';
    const alertBox = document.getElementById('facultyActionAlert');
    if (alertBox) alertBox.innerHTML = '';

    if (decision === 'REJECT' && !remarks) {
      if (alertBox) {
        alertBox.innerHTML = `<div class="alert alert-warning alert-dismissible fade show py-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>Please enter remarks explaining why the photo or application is being rejected.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
      }
      return;
    }

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "processFacultyAction",
          rowIndex: rowIndex,
          decision: decision,
          remarks: remarks,
          role: currentFaculty.role
        })
      });

      const data = await res.json();

      if (data.success) {
        if (alertBox) {
          alertBox.innerHTML = `<div class="alert alert-success alert-dismissible fade show py-2" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>${data.message || 'Application updated successfully.'}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>`;
        }
        loadPendingApplications();
      } else {
        if (alertBox) {
          alertBox.innerHTML = `<div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
            <i class="bi bi-x-circle-fill me-2"></i>Failed to process action: ${data.message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>`;
        }
      }
    } catch (err) {
      if (alertBox) {
        alertBox.innerHTML = `<div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
          <i class="bi bi-exclamation-octagon-fill me-2"></i>Error processing action: ${err.message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
      }
    }
  };

  window.submitAddTeacher = async function(event) {
    if (event) event.preventDefault();
    const btn = document.getElementById('btnSaveTeacher');
    const alertBox = document.getElementById('addTeacherAlert');
    alertBox.innerHTML = '';

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Saving...`;

    try {
      const payload = {
        action: "addClassTeacher",
        hodEmail: currentFaculty.email,
        teacherEmail: document.getElementById('newTeacherEmail').value.trim(),
        teacherName: document.getElementById('newTeacherName').value.trim(),
        department: document.getElementById('newTeacherDept').value.trim(),
        specialization: document.getElementById('newTeacherSpec').value.trim(),
        batch: document.getElementById('newTeacherBatch').value.trim(),
        section: document.getElementById('newTeacherSection').value.trim()
      };

      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        alertBox.innerHTML = `<div class="alert alert-success py-2"><i class="bi bi-check-circle-fill me-2"></i>${data.message}</div>`;
        document.getElementById('addTeacherForm').reset();
        document.getElementById('newTeacherDept').value = currentFaculty.department;
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-x-circle-fill me-2"></i>${data.message}</div>`;
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-exclamation-octagon-fill me-2"></i>Error: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = `Save Teacher`;
    }
    return false;
  };
</script>

</body>
</html>
